<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Nurse.ng{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Nurse.ng</a>
      <nav class="site-nav">
        {% if user %}
          <a href="/profile">Profile</a>
          <a href="/auth/dashboard">Account</a>
          <form method="post" action="/auth/logout" class="inline-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="link-button">Sign out</button>
          </form>
        {% else %}
          <a href="/auth/login">Sign in</a>
          <a href="/auth/register">Create account</a>
        {% endif %}
      </nav>
    </header>

    <main class="site-main">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <p>
        Nurse.ng is not the Nursing and Midwifery Council of Nigeria, does not
        issue licences, and does not replace the official register.
      </p>
    </footer>
  </body>
</html>
