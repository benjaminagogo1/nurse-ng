<div class="divider-text">Continue with an account</div>
<div class="social-row">
  {% for provider, label, mark in [('google', 'Google', 'G'), ('linkedin', 'LinkedIn', 'in')] %}
  <form method="post" action="/auth/social/{{ provider }}/start" data-native-submit>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button class="btn-social" type="submit"><span class="social-mark {{ 'g' if provider == 'google' else 'in' }}">{{ mark }}</span> {{ label }}</button>
  </form>
  {% endfor %}
</div>
