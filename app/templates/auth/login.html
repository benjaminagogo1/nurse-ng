{% extends "base.html" %}

{% block title %}Sign in — Nurse.ng{% endblock %}

{% block content %}
<section class="form-page">
  <p class="eyebrow">Sign in</p>
  <h1>Sign in to Nurse.ng</h1>

  {% if error %}
    <p class="form-error" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="/auth/login" class="stacked-form" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <label for="phone">Phone number</label>
    <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel"
           value="{{ phone or '' }}" placeholder="+234 801 234 5678" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit">Sign in</button>
  </form>

  <p class="form-alt">New here? <a href="/auth/register">Create an account</a>.</p>
</section>
{% endblock %}
