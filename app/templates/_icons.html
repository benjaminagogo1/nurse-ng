{% macro icon(name, size=20) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == 'logo' %}
<path d="M12 21S2 15.3 2 8.5A5.5 5.5 0 0 1 12 5.3 5.5 5.5 0 0 1 22 8.5C22 15.3 12 21 12 21Z" fill="currentColor" stroke="none"/><path d="M6.5 12h3l1.5-4 2 8 1.5-4h3" stroke="var(--logo-line, white)" stroke-width="1.8"/>
{% elif name == 'dashboard' %}
<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
{% elif name == 'user' %}
<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 6 0 0 1 16 0v1"/>
{% elif name == 'users' %}
<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-7.3 13-7.3 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.7c2.2.6 3.5 2.2 3.5 5.3"/>

<path d="M21 11.5a8.5 8.5 0 0 1-12.7 7.3L3 20l1.2-5.3A8.5 8.5 0 1 1 21 11.5Z"/><path d="M8 9h8M8 13h5"/>

<path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/>

<circle cx="10.8" cy="10.8" r="6.8"/><path d="m20.5 20.5-4.9-4.9"/>

<path d="m12 3-7.5 3v5.5c0 4.6 3.2 8.2 7.5 9.5 4.3-1.3 7.5-4.9 7.5-9.5V6L12 3Z"/><path d="m8.8 12 2.3 2.3 4.4-4.6"/>
{% elif name == 'review' %}
<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v4H9zM9 12h6M9 16h4"/>

<path d="M12 21S2 15.3 2 8.5A5.5 5.5 0 0 1 12 5.3 5.5 5.5 0 0 1 22 8.5C22 15.3 12 21 12 21Z"/>

<rect x="3" y="3" width="18" height="18" rx="5"/><path d="m10 8 6 4-6 4V8Z"/>

<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/>
{% elif name == 'appearance' %}
<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none"/>
{% elif name == 'sun' %}
<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>
{% elif name == 'moon' %}
<path d="M20.6 14.3A9 9 0 0 1 9.7 3.4 9 9 0 1 0 20.6 14.3Z"/>
{% elif name == 'monitor' %}
<rect x="3" y="3" width="18" height="13" rx="2"/><path d="M12 16v5M8 21h8"/>
{% endif %}
</svg>
{%- endmacro %}
