name: Mobile preview builds
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Hosted HTTPS site (leave blank for the offline preview)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NURSE_NG_MOBILE_URL: ${{ inputs.site_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci && npm test && npm run android:preview
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: nurse-ng-android-preview
          path: mobile/dist/nurse-ng-preview.apk
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      NURSE_NG_MOBILE_URL: ${{ inputs.site_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci && npm run configure && npx cap sync ios
        working-directory: mobile
      - run: >-
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath mobile/ios/DerivedData CODE_SIGNING_ALLOWED=NO build
      - run: >-
          ditto -c -k --sequesterRsrc --keepParent
          mobile/ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          nurse-ng-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nurse-ng-ios-simulator
          path: nurse-ng-ios-simulator.zip
